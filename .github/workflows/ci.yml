name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest suite
        working-directory: dsh-phone
        run: python -m unittest -v

  web:
    name: PWA render tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run md.js tests
        run: node dsh-phone/web/test-md.js
      - name: Run itemrender.js tests
        run: node dsh-phone/web/test-items.js
      - name: Run draftsync.js tests
        run: node dsh-phone/web/test-draft.js
      - name: Run QR sign-in tests
        run: node dsh-phone/web/test-qr.js

  plugin:
    name: dsh-phone-bridge plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dsh-phone/plugin/dsh-phone-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Зависимостей нет: плагин намеренно не тянет ни cordis, ни внешние пакеты,
      # поэтому install-шаг не нужен и не может разъехаться с lockfile.
      - name: Syntax check every js/mjs
        run: |
          find lib scripts test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
      - name: Unit tests (host modules + browser half + wire protocol)
        run: node --test
      - name: Host bridge smoke (protocol, read path, sync feed)
        run: node scripts/smoke-host-bridge.mjs
      - name: Host write-path smoke (createAndStart, startTurn, selections)
        run: node scripts/smoke-host-write.mjs
      - name: Cordis lifecycle smoke (skips when cordis is unavailable)
        run: node scripts/smoke-cordis-lifecycle.mjs

  rust:
    name: Rust core tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: dsh-phone-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dsh-phone-desktop/src-tauri -> target
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      # generate_context! embeds ../dist, so the frontend must exist before cargo test
      - name: Build frontend dist
        run: pnpm run build
      - name: Run cargo tests
        working-directory: dsh-phone-desktop/src-tauri
        run: cargo test --locked
      - name: Clippy (fail on warnings)
        working-directory: dsh-phone-desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      # Смоук HTTP-канала плагина: поднимает настоящий процесс узла на временном
      # конфиге (боевой ~/.dsh-phone не трогает) с отключёнными TCP-мостами и
      # прогоняет hello -> poll -> result -> event-feed -> RPC телефона -> метрики.
      - name: Build debug node binary
        working-directory: dsh-phone-desktop/src-tauri
        run: cargo build --locked
      - name: Plugin HTTP channel smoke
        working-directory: dsh-phone-desktop/src-tauri
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ../../scripts/smoke-plugin-channel.ps1
