# dsh-draft-sync bundle patch: inserts the draft-sync plugin row into the web
# plugin roster. Node half is a no-op placeholder (the whole engine lives in
# the browser half); the dsh.client declaration in package.json makes
# dsh-client-modules serve lib/client.js under /plugins and add it to
# __DSH_BOOT__, where the browser cordis Loader materializes and activates it
# with no injected services.
- insert:
    - id: dsh-draft-sync
      name: dsh-draft-sync
