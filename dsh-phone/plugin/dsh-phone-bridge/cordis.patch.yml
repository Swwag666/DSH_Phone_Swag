# dsh-phone-bridge bundle patch: вставляет ряд плагина в ростер cordis.
#
# Ровно тот же механизм, которым Desktop подключает мост Agents Anywhere
# (`id` + `name` пакета), поэтому один и тот же ряд даёт две половины:
#   * host-половина (main -> lib/index.js): ctx.plugin(DshPhoneBridgeService)
#     поднимает TCP-мост на 127.0.0.1 и пишет
#     <DSH_HOME>/dsh-phone/bridge/endpoint.json;
#   * web-половина (dsh.client.platform: web -> exports["./client"]):
#     dsh-client-modules отдаёт lib/client.js в /plugins и добавляет его в
#     __DSH_BOOT__, где браузерный Loader его материализует.
#
# config намеренно пустой: Desktop inject-ит dshHome только ряду AA, поэтому наш
# сервис сам резолвит DSH_HOME (process.env.DSH_HOME либо ~/.dsh).
- insert:
    - id: dsh-phone-bridge
      name: dsh-phone-bridge
      config: {}
