<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>dsh draft-sync gui stand</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 24px; background: #202124; color: #e8eaed; }
  .box { max-width: 640px; margin: 0 auto; }
  #composer {
    min-height: 72px; border: 1px solid #5f6368; border-radius: 12px;
    padding: 12px 14px; background: #2d2f31; outline: none; white-space: pre-wrap;
  }
  #composer:focus { border-color: #8ab4f8; }
  button { margin: 8px 6px 0 0; padding: 6px 12px; border-radius: 8px; border: 1px solid #5f6368; background: #2d2f31; color: #e8eaed; cursor: pointer; }
  #status { margin-top: 10px; color: #9aa0a6; font-size: 12px; }
  pre { background: #17181a; padding: 8px; border-radius: 8px; overflow: auto; }
</style>
</head>
<body>
<div class="box">
  <h3>Композер (эмуляция DSH Desktop)</h3>
  <div id="composer" data-composer-input="true" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="false"></div>
  <button id="open-sess">Открыть сессию (session/page)</button>
  <button id="phone-push">Телефон: push черновика</button>
  <button id="phone-get">Телефон: прочитать черновик</button>
  <div id="status">stand loaded</div>
  <pre id="out"></pre>
</div>
<script src="/draftsync-desktop.js"></script>
<script>
  var SID = "session-4d1c6608-5b71-4588-943a-ebdb9ea061b2";
  var out = document.getElementById("out");
  function say(line) { out.textContent = line + "\n" + out.textContent; }
  document.getElementById("open-sess").onclick = function () {
    // exactly the shape the real GUI transport emits: POST /api/<endpoint>
    // with a JSON body carrying the harness session id
    fetch("/api/session/page", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        type: "client-request",
        rpcId: "test-1",
        method: "session/page",
        payload: { args: { agentId: SID, request: {} } }
      })
    }).catch(function () {});
    say("sent session/page for " + SID);
  };
  document.getElementById("phone-push").onclick = function () {
    var text = prompt("Черновик с телефона:", "привет из телефона");
    if (text === null) return;
    fetch("http://127.0.0.1:8460/api/rpc", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ method: "session.updateDraft", params: { sessionId: SID, text: text, origin: "phone-pwa" } })
    }).then(function (r) { return r.json(); }).then(function (j) { say("phone push -> " + JSON.stringify(j)); });
  };
  document.getElementById("phone-get").onclick = function () {
    fetch("http://127.0.0.1:8460/api/rpc", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ method: "session.getDraft", params: { sessionId: SID } })
    }).then(function (r) { return r.json(); }).then(function (j) { say("phone get -> " + JSON.stringify(j)); });
  };
</script>
</body>
</html>
