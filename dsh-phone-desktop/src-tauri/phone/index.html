<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08080b" />
<title>DSH Phone — узел</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0d;
    background-image:
      linear-gradient(rgba(207,206,198,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(207,206,198,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    color: #cfcec6;
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 420px;
    background: linear-gradient(180deg, #111116, #0d0d11);
    border: 1px solid #1d1d23;
    border-radius: 8px;
    padding: 28px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  .logo {
    width: 52px; height: 52px; margin: 0 auto 16px;
    border: 1px solid #2e2424; border-radius: 6px;
    background: #0e0e12;
    display: flex; align-items: center; justify-content: center;
    color: #8a3838; font-size: 22px;
    box-shadow: 0 0 20px rgba(138,56,56,.18);
  }
  h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: .22em; }
  .tag { color: #8a3838; letter-spacing: .18em; font-size: 10px; text-transform: uppercase; }
  p { margin: 6px 0; color: #6f6f75; font-size: 13px; line-height: 1.5; }
  .mono { font-family: inherit; font-size: 13px; }
  .row {
    margin-top: 16px; padding: 10px 14px; border-radius: 4px;
    background: rgba(0,0,0,.3); border: 1px solid #1d1d23;
    display: flex; justify-content: space-between; gap: 10px; text-align: left;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
  .dot.off { background: #5c7656; box-shadow: 0 0 10px rgba(92,118,86,.5); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">◆</div>
    <h1>DSH <span style="color:#8a3838;">PHONE</span></h1>
    <div class="tag">порядок · честь · протокол</div>
    <p>Мост поднят. Полный чат-интерфейс скоро — это оболочка первого запуска.</p>
    <div class="row mono"><span>узел</span><span class="dot off"></span></div>
    <div class="row mono" id="health"><span>здоровье</span><span>…</span></div>
  </div>
  <script>
    fetch('/api/health').then(r => r.json()).then(h => {
      document.getElementById('health').innerHTML =
        '<span>здоровье</span><span>ok · ' + h.uptime + 'с · ' + h.requests + ' req</span>';
    }).catch(() => {
      document.getElementById('health').innerHTML = '<span>здоровье</span><span>нет связи</span>';
    });
  </script>
</body>
</html>
