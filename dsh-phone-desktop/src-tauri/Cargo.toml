[package]
name = "dsh-phone"
version = "0.3.0"
description = "DSH Phone - Ð»Ð¾ÐºÐ°Ð»ÑŒÐ½Ñ‹Ð¹ Ð¼Ð¾ÑÑ‚ Ð¼ÐµÐ¶Ð´Ñƒ DSH Desktop Ð¸ Ñ‚ÐµÐ»ÐµÑ„Ð¾Ð½Ð¾Ð¼"
authors = ["Rustvy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = "0.7"
rand = "0.8"
dirs = "5"
get_if_addrs = "0.5"
base64 = "0.22"
sha2 = "0.10"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.13"
rustls-pemfile = "2"

# push notifications: Web Push (VAPID + RFC 8291 aes128gcm) and ntfy
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "arithmetic"] }
hkdf = "0.12"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3
