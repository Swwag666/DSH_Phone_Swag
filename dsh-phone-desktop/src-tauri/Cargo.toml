[package]
name = "dsh-phone"
version = "0.3.0"
description = "DSH Phone - local bridge between DSH Desktop and your phone"
authors = ["Rustvy"]
edition = "2021"
# 1.77 был устаревшим и заставлял cargo тянуть RC-версии tauri-plugin-*:
# стабильные 2.x объявляют rust-version 1.90. Пин ниже - честный MSRV сборки.
rust-version = "1.90"

[lib]
name = "dsh_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = "0.7"
rand = "0.8"
dirs = "5"
get_if_addrs = "0.5"
base64 = "0.22"
sha2 = "0.10"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
# x509-parser: чтобы перечитывать свой же CA из PEM и подписывать им лист
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls-pemfile = "2"
# Explicit dependency so we can install a CryptoProvider ourselves. The plain
# `tls-rustls` feature of axum-server hard-pulls rustls's default provider
# (aws-lc-rs), which feature-unifies with `ring` (reqwest/rcgen) and makes
# rustls 0.23 panic at runtime instead of picking one - silently killing the
# TLS listener. `tls-rustls-no-provider` + default-features=false leaves ring
# as the ONLY provider (we install_default() it at startup) and drops aws-lc-sys
# from the tree, which also fixes flaky Windows MSVC builds (cmake/-std:c99).
# See axum-server#153 / rustls#2148.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# push notifications: Web Push (VAPID + RFC 8291 aes128gcm) and ntfy
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "arithmetic"] }
hkdf = "0.12"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
# автообновление из GitHub Releases; рестарт после установки делает ядро tauri
# (request_restart), поэтому отдельный process-плагин не нужен
tauri-plugin-updater = "2"
# QR для подключения телефона (svg-рендер, без image-зависимостей)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3

[dev-dependencies]
minisign-verify = "0.2.5"
