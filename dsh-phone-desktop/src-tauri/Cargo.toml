[package]
name = "dsh-phone"
version = "0.1.0"
description = "DSH Phone - локальный мост между DSH Desktop и телефоном"
authors = ["Rustvy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = "0.7"
rand = "0.8"
dirs = "5"
get_if_addrs = "0.5"
base64 = "0.22"
sha2 = "0.10"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.13"
rustls-pemfile = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3
